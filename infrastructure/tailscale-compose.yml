version: '3.8'

services:
  tailscale:
    container_name: tailscaled
    image: tailscale/tailscale:latest
    hostname: node-aureus
    environment:
      - TS_AUTHKEY=tskey-auth-changeme # Insert your one-off or reusable auth key
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    network_mode: host
    restart: unless-stopped

volumes:
  tailscale_data:
